<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blacktom.gh — Media Player</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0a0000">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0000; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .player { background: rgba(20,0,0,0.8); backdrop-filter: blur(30px); border-radius: 24px; padding: 25px; width: 100%; max-width: 520px; border: 1px solid rgba(220,20,60,0.3); box-shadow: 0 30px 60px rgba(220,20,60,0.15), 0 0 80px rgba(180,0,30,0.08); }
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg, #dc143c, #ff1744, #b71c1c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 3px; }
        .subtitle { font-size: 0.75rem; color: #666; letter-spacing: 1px; }
        .media-area { text-align: center; margin-bottom: 20px; min-height: 220px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(220,20,60,0.2); }
        .media-area video { width: 100%; max-height: 300px; border-radius: 12px; display: none; object-fit: contain; background: #000; }
        .media-area .album-art { font-size: 5rem; display: block; }
        .media-area .no-media { color: #555; font-size: 0.9rem; display: block; }
        .song-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 3px; text-align: center; }
        .song-artist { font-size: 0.8rem; color: #888; text-align: center; margin-bottom: 15px; }
        .progress-section { margin-bottom: 15px; }
        .progress-bar-container { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; cursor: pointer; position: relative; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #dc143c, #ff1744); border-radius: 3px; width: 0%; transition: width 0.1s; position: relative; box-shadow: 0 0 10px rgba(220,20,60,0.5); }
        .progress-bar::after { content: ''; position: absolute; right: -5px; top: -3px; width: 12px; height: 12px; background: #ff1744; border-radius: 50%; box-shadow: 0 0 15px rgba(255,23,68,0.8); }
        .time-info { display: flex; justify-content: space-between; color: #666; font-size: 0.7rem; margin-top: 5px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .control-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; transition: all 0.2s; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .control-btn:hover { background: rgba(220,20,60,0.2); }
        .play-btn { width: 60px; height: 60px; background: linear-gradient(135deg, #dc143c, #b71c1c); border-radius: 50%; font-size: 1.6rem; box-shadow: 0 10px 30px rgba(220,20,60,0.5), 0 0 60px rgba(180,0,30,0.2); border: none; color: #fff; cursor: pointer; }
        .play-btn:hover { transform: scale(1.08); box-shadow: 0 15px 40px rgba(220,20,60,0.7); }
        .upload-section { display: flex; gap: 10px; margin-bottom: 15px; }
        .upload-btn { flex: 1; background: rgba(255,255,255,0.03); color: #888; border: 1px dashed rgba(220,20,60,0.3); padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; text-align: center; transition: all 0.3s; }
        .upload-btn:hover { border-color: #dc143c; color: #dc143c; background: rgba(220,20,60,0.08); }
        .file-input { display: none; }
        .playlist-title { color: #888; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .playlist { list-style: none; max-height: 180px; overflow-y: auto; }
        .playlist::-webkit-scrollbar { width: 3px; }
        .playlist::-webkit-scrollbar-thumb { background: rgba(220,20,60,0.3); border-radius: 2px; }
        .playlist-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: #999; font-size: 0.85rem; }
        .playlist-item:hover { background: rgba(220,20,60,0.08); color: #fff; }
        .playlist-item.active { background: rgba(220,20,60,0.2); color: #dc143c; font-weight: 600; }
        .playlist-item .media-icon { font-size: 1rem; width: 20px; }
        .track-info { flex: 1; }
        .track-name { font-size: 0.8rem; }
        .track-type { font-size: 0.65rem; color: #555; }
        .credits { text-align: center; margin-top: 15px; color: #555; font-size: 0.7rem; letter-spacing: 1px; }
        .credits span { background: linear-gradient(135deg, #dc143c, #ff1744); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600; }
        @media (max-width:480px) { .player { padding: 18px; } .logo { font-size: 1.3rem; } .play-btn { width: 50px; height: 50px; font-size: 1.3rem; } .media-area { min-height: 180px; } }
    </style>
</head>
<body>
    <div class="player">
        <div class="header"><div class="logo">BLACKTOM.GH</div><div class="subtitle">BLACKTOM MEDIA PLAYER</div></div>
        
        <div class="media-area" id="mediaArea">
            <video id="videoPlayer" controls playsinline></video>
            <div class="album-art" id="albumArt">🎵</div>
            <div class="no-media" id="noMedia">Upload music or videos below</div>
        </div>
        
        <div class="song-title" id="songTitle">No Media Selected</div>
        <div class="song-artist" id="songArtist">Add files to get started</div>
        
        <div class="progress-section">
            <div class="progress-bar-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
            <div class="time-info"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="prevBtn">⏮️</button>
            <button class="play-btn" id="playBtn">▶️</button>
            <button class="control-btn" id="nextBtn">⏭️</button>
        </div>
        
        <div class="upload-section">
            <button class="upload-btn" id="audioUploadBtn">🎵 Add Audio</button>
            <button class="upload-btn" id="videoUploadBtn">🎬 Add Video</button>
        </div>
        <input type="file" class="file-input" id="audioInput" accept="audio/*" multiple>
        <input type="file" class="file-input" id="videoInput" accept="video/*" multiple>
        
        <div class="playlist-title">Your Playlist</div>
        <ul class="playlist" id="playlist">
            <li class="playlist-item" style="color:#555;text-align:center;padding:25px">No files added yet 🎵🎬</li>
        </ul>
        
        <div class="credits">Specially made by <span>Rich</span> for <span>Blacktom.gh</span></div>
    </div>

    <script>
        const audio = new Audio();
        const video = document.getElementById('videoPlayer');
        let playlist = [], currentIndex = -1, isPlaying = false, currentType = 'audio';
        
        const playBtn = document.getElementById('playBtn'), prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn'), progressBar = document.getElementById('progressBar'), progressContainer = document.getElementById('progressContainer'), currentTimeEl = document.getElementById('currentTime'), durationEl = document.getElementById('duration'), songTitle = document.getElementById('songTitle'), songArtist = document.getElementById('songArtist'), albumArt = document.getElementById('albumArt'), noMedia = document.getElementById('noMedia'), playlistEl = document.getElementById('playlist'), audioInput = document.getElementById('audioInput'), videoInput = document.getElementById('videoInput'), audioUploadBtn = document.getElementById('audioUploadBtn'), videoUploadBtn = document.getElementById('videoUploadBtn');
        
        audio.volume = 0.8; video.volume = 0.8;
        
        audioUploadBtn.addEventListener('click', () => audioInput.click());
        videoUploadBtn.addEventListener('click', () => videoInput.click());
        
        function addFiles(files, type) {
            for (let file of files) {
                if ((type === 'audio' && file.type.startsWith('audio/')) || (type === 'video' && file.type.startsWith('video/'))) {
                    playlist.push({ name: file.name.replace(/\.[^/.]+$/, ""), type: type, url: URL.createObjectURL(file), duration: '--:--' });
                }
            }
            renderPlaylist();
            if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
            audioInput.value = ''; videoInput.value = '';
        }
        
        audioInput.addEventListener('change', (e) => addFiles(e.target.files, 'audio'));
        videoInput.addEventListener('change', (e) => addFiles(e.target.files, 'video'));
        
        function renderPlaylist() {
            if (playlist.length === 0) { playlistEl.innerHTML = '<li class="playlist-item" style="color:#555;text-align:center;padding:25px">No files added yet 🎵🎬</li>'; return; }
            playlistEl.innerHTML = playlist.map((t, i) => `<li class="playlist-item ${i === currentIndex ? 'active' : ''}" onclick="loadTrack(${i})"><span class="media-icon">${t.type === 'video' ? '🎬' : '🎵'}</span><span class="track-info"><div class="track-name">${t.name}</div><div class="track-type">${t.type === 'video' ? 'Video' : 'Audio'}</div></span></li>`).join('');
        }
        
        function loadTrack(i) {
            if (i < 0 || i >= playlist.length) return;
            currentIndex = i; currentType = playlist[i].type;
            songTitle.textContent = playlist[i].name;
            songArtist.textContent = currentType === 'video' ? 'Video Playing' : 'Audio Playing';
            
            if (currentType === 'video') {
                audio.pause(); audio.src = '';
                video.src = playlist[i].url; video.style.display = 'block';
                albumArt.style.display = 'none'; noMedia.style.display = 'none';
                video.load(); video.play();
                isPlaying = true; playBtn.textContent = '⏸️';
            } else {
                video.pause(); video.style.display = 'none'; video.src = '';
                albumArt.style.display = 'block'; albumArt.textContent = '🎵';
                noMedia.style.display = 'none';
                audio.src = playlist[i].url; audio.play();
                isPlaying = true; playBtn.textContent = '⏸️';
            }
            renderPlaylist();
        }
        
        function playMedia() {
            if (currentType === 'video') { video.play(); }
            else { audio.play(); }
            isPlaying = true; playBtn.textContent = '⏸️';
        }
        
        function pauseMedia() {
            if (currentType === 'video') { video.pause(); }
            else { audio.pause(); }
            isPlaying = false; playBtn.textContent = '▶️';
        }
        
        playBtn.addEventListener('click', () => { if (playlist.length === 0) return; isPlaying ? pauseMedia() : playMedia(); });
        prevBtn.addEventListener('click', () => { if (playlist.length === 0) return; loadTrack((currentIndex - 1 + playlist.length) % playlist.length); });
        nextBtn.addEventListener('click', () => { if (playlist.length === 0) return; loadTrack((currentIndex + 1) % playlist.length); });
        
        function updateProgress() {
            const media = currentType === 'video' ? video : audio;
            if (media.duration) {
                progressBar.style.width = (media.currentTime / media.duration) * 100 + '%';
                currentTimeEl.textContent = formatTime(media.currentTime);
                durationEl.textContent = formatTime(media.duration);
                if (playlist[currentIndex]) playlist[currentIndex].duration = formatTime(media.duration);
            }
        }
        
        audio.addEventListener('timeupdate', updateProgress);
        video.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', () => loadTrack(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0));
        video.addEventListener('ended', () => loadTrack(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0));
        audio.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audio.duration); });
        video.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(video.duration); });
        progressContainer.addEventListener('click', (e) => {
            const media = currentType === 'video' ? video : audio;
            if (!media.duration) return;
            media.currentTime = (e.offsetX / progressContainer.clientWidth) * media.duration;
        });
        
        function formatTime(s) { if (isNaN(s)) return '0:00'; return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }
    </script>
</body>
</html>
