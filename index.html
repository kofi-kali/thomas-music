<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blacktom.gh — Media Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0000; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .player { background: rgba(20,0,0,0.8); backdrop-filter: blur(30px); border-radius: 24px; padding: 25px; width: 100%; max-width: 520px; border: 1px solid rgba(220,20,60,0.3); box-shadow: 0 30px 60px rgba(220,20,60,0.15); }
        
        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #dc143c, #ff1744); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 3px; }
        .subtitle { font-size: 0.75rem; color: #666; letter-spacing: 1px; }
        
        .media-area { text-align: center; margin-bottom: 20px; min-height: 200px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(220,20,60,0.2); position: relative; }
        .media-area video { width: 100%; height: auto; max-height: 300px; display: block; background: #000; }
        .media-area .album-art { font-size: 5rem; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .media-area .no-media { color: #555; font-size: 0.9rem; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        .song-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 3px; text-align: center; }
        .song-artist { font-size: 0.8rem; color: #888; text-align: center; margin-bottom: 15px; }
        
        .progress-section { margin-bottom: 15px; }
        .progress-bar-container { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; cursor: pointer; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #dc143c, #ff1744); border-radius: 3px; width: 0%; transition: width 0.1s; box-shadow: 0 0 10px rgba(220,20,60,0.5); }
        .time-info { display: flex; justify-content: space-between; color: #666; font-size: 0.7rem; margin-top: 5px; }
        
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .control-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .control-btn:hover { background: rgba(220,20,60,0.2); }
        .play-btn { width: 60px; height: 60px; background: linear-gradient(135deg, #dc143c, #b71c1c); border-radius: 50%; font-size: 1.6rem; box-shadow: 0 10px 30px rgba(220,20,60,0.5); border: none; color: #fff; cursor: pointer; }
        .play-btn:hover { transform: scale(1.08); }
        
        .upload-section { display: flex; gap: 10px; margin-bottom: 15px; }
        .upload-btn { flex: 1; background: rgba(255,255,255,0.03); color: #888; border: 1px dashed rgba(220,20,60,0.3); padding: 12px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; text-align: center; transition: all 0.3s; }
        .upload-btn:hover { border-color: #dc143c; color: #dc143c; background: rgba(220,20,60,0.08); }
        .file-input { display: none; }
        
        .status { text-align: center; color: #dc143c; font-size: 0.75rem; margin-bottom: 10px; min-height: 18px; }
        
        .playlist-title { color: #888; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .playlist { list-style: none; max-height: 180px; overflow-y: auto; }
        .playlist::-webkit-scrollbar { width: 3px; }
        .playlist::-webkit-scrollbar-thumb { background: rgba(220,20,60,0.3); border-radius: 2px; }
        .playlist-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: #999; font-size: 0.85rem; }
        .playlist-item:hover { background: rgba(220,20,60,0.08); color: #fff; }
        .playlist-item.active { background: rgba(220,20,60,0.2); color: #dc143c; font-weight: 600; }
        .playlist-item .media-icon { font-size: 1rem; width: 20px; }
        .track-info { flex: 1; }
        .track-name { font-size: 0.8rem; }
        .track-type { font-size: 0.65rem; color: #555; }
        .delete-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 0.9rem; padding: 5px; transition: all 0.2s; }
        .delete-btn:hover { color: #dc143c; }
        
        .credits { text-align: center; margin-top: 15px; color: #555; font-size: 0.7rem; letter-spacing: 1px; }
        .credits span { background: linear-gradient(135deg, #dc143c, #ff1744); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600; }
        
        @media (max-width:480px) { .player { padding: 18px; } .logo { font-size: 1.3rem; } .play-btn { width: 50px; height: 50px; font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="player">
        <div class="header"><div class="logo">BLACKTOM.GH</div><div class="subtitle">BLACKTOM MEDIA PLAYER</div></div>
        
        <div class="media-area" id="mediaArea">
            <video id="videoPlayer" controls playsinline style="display:none;"></video>
            <div class="album-art" id="albumArt">🎵</div>
            <div class="no-media" id="noMedia">Upload music or videos below</div>
        </div>
        
        <div class="song-title" id="songTitle">No Media Selected</div>
        <div class="song-artist" id="songArtist">Add files to get started</div>
        
        <div class="progress-section">
            <div class="progress-bar-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
            <div class="time-info"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="prevBtn">⏮️</button>
            <button class="play-btn" id="playBtn">▶️</button>
            <button class="control-btn" id="nextBtn">⏭️</button>
        </div>
        
        <div class="status" id="statusMsg"></div>
        
        <div class="upload-section">
            <button class="upload-btn" id="audioUploadBtn">🎵 Add Audio</button>
            <button class="upload-btn" id="videoUploadBtn">🎬 Add Video</button>
        </div>
       <input type="file" class="file-input" id="audioInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.wma,.flac">
       <input type="file" class="file-input" id="videoInput" accept="video/*,.mp4,.webm,.mkv,.avi,.mov,.3gp">
        
        <div class="playlist-title">Your Playlist</div>
        <ul class="playlist" id="playlist">
            <li class="playlist-item" style="color:#555;text-align:center;padding:25px">No files added yet 🎵🎬</li>
        </ul>
        
        <div class="credits">Specially made by <span>Rich</span> for <span>Blacktom.gh</span></div>
    </div>

    <script>
        const audio = new Audio();
        const video = document.getElementById('videoPlayer');
        let playlist = [], currentIndex = -1, isPlaying = false, currentType = 'audio';
        
        const playBtn = document.getElementById('playBtn'), prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn'), progressBar = document.getElementById('progressBar'), progressContainer = document.getElementById('progressContainer'), currentTimeEl = document.getElementById('currentTime'), durationEl = document.getElementById('duration'), songTitle = document.getElementById('songTitle'), songArtist = document.getElementById('songArtist'), albumArt = document.getElementById('albumArt'), noMedia = document.getElementById('noMedia'), playlistEl = document.getElementById('playlist'), audioInput = document.getElementById('audioInput'), videoInput = document.getElementById('videoInput'), audioUploadBtn = document.getElementById('audioUploadBtn'), videoUploadBtn = document.getElementById('videoUploadBtn'), statusMsg = document.getElementById('statusMsg');
        
        audio.volume = 0.8; video.volume = 0.8;
        
        audioUploadBtn.addEventListener('click', () => audioInput.click());
        videoUploadBtn.addEventListener('click', () => videoInput.click());
        
        function addFile(file, type) {
            statusMsg.textContent = 'Loading: ' + file.name + '...';
            const url = URL.createObjectURL(file);
            playlist.push({ name: file.name.replace(/\.[^/.]+$/, ""), type: type, url: url, duration: '--:--' });
            renderPlaylist();
            if (currentIndex === -1) loadTrack(0);
            statusMsg.textContent = '✅ Added: ' + file.name;
            setTimeout(() => statusMsg.textContent = '', 2000);
        }
        
        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('audio/')) { addFile(file, 'audio'); }
            else { statusMsg.textContent = '❌ Please select a valid audio file (MP3, WAV, etc.)'; }
            audioInput.value = '';
        });
        
        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('video/')) { addFile(file, 'video'); }
            else { statusMsg.textContent = '❌ Please select a valid video file (MP4, WebM, etc.)'; }
            videoInput.value = '';
        });
        
        function renderPlaylist() {
            if (playlist.length === 0) { playlistEl.innerHTML = '<li class="playlist-item" style="color:#555;text-align:center;padding:25px">No files added yet 🎵🎬</li>'; return; }
            playlistEl.innerHTML = playlist.map((t, i) => `<li class="playlist-item ${i === currentIndex ? 'active' : ''}">
                <span class="media-icon">${t.type === 'video' ? '🎬' : '🎵'}</span>
                <span class="track-info" onclick="loadTrack(${i})"><div class="track-name">${t.name}</div><div class="track-type">${t.type === 'video' ? 'Video' : 'Audio'}</div></span>
                <button class="delete-btn" onclick="removeTrack(${i})">🗑️</button>
            </li>`).join('');
        }
        
        function removeTrack(i) {
            if (i === currentIndex) { pauseMedia(); audio.src = ''; video.src = ''; video.style.display = 'none'; }
            playlist.splice(i, 1);
            if (currentIndex >= playlist.length) currentIndex = playlist.length - 1;
            if (currentIndex >= 0) loadTrack(currentIndex);
            renderPlaylist();
            if (playlist.length === 0) { songTitle.textContent = 'No Media Selected'; songArtist.textContent = 'Add files to get started'; albumArt.style.display = 'block'; albumArt.textContent = '🎵'; noMedia.style.display = 'block'; }
        }
        
        function loadTrack(i) {
            if (i < 0 || i >= playlist.length) return;
            currentIndex = i; currentType = playlist[i].type;
            songTitle.textContent = playlist[i].name;
            songArtist.textContent = currentType === 'video' ? '🎬 Video' : '🎵 Audio';
            
            pauseMedia();
            
            if (currentType === 'video') {
                audio.src = '';
                video.src = playlist[i].url; video.style.display = 'block';
                albumArt.style.display = 'none'; noMedia.style.display = 'none';
                video.load();
                setTimeout(() => { video.play().catch(() => {}); isPlaying = true; playBtn.textContent = '⏸️'; }, 300);
            } else {
                video.pause(); video.style.display = 'none'; video.src = '';
                albumArt.style.display = 'block'; albumArt.textContent = '🎵';
                noMedia.style.display = 'none';
                audio.src = playlist[i].url; audio.load();
                setTimeout(() => { audio.play().catch(() => {}); isPlaying = true; playBtn.textContent = '⏸️'; }, 300);
            }
            renderPlaylist();
        }
        
        function playMedia() {
            if (currentType === 'video') { video.play().catch(() => {}); }
            else { audio.play().catch(() => {}); }
            isPlaying = true; playBtn.textContent = '⏸️';
        }
        
        function pauseMedia() {
            if (currentType === 'video') { video.pause(); }
            else { audio.pause(); }
            isPlaying = false; playBtn.textContent = '▶️';
        }
        
        playBtn.addEventListener('click', () => { if (playlist.length === 0) return; isPlaying ? pauseMedia() : playMedia(); });
        prevBtn.addEventListener('click', () => { if (playlist.length === 0) return; loadTrack((currentIndex - 1 + playlist.length) % playlist.length); });
        nextBtn.addEventListener('click', () => { if (playlist.length === 0) return; loadTrack((currentIndex + 1) % playlist.length); });
        
        function updateProgress() {
            const media = currentType === 'video' ? video : audio;
            if (media && media.duration) {
                progressBar.style.width = (media.currentTime / media.duration) * 100 + '%';
                currentTimeEl.textContent = formatTime(media.currentTime);
                durationEl.textContent = formatTime(media.duration);
            }
        }
        
        audio.addEventListener('timeupdate', updateProgress);
        video.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', () => loadTrack(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0));
        video.addEventListener('ended', () => loadTrack(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0));
        audio.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audio.duration); });
        video.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(video.duration); });
        progressContainer.addEventListener('click', (e) => {
            const media = currentType === 'video' ? video : audio;
            if (!media || !media.duration) return;
            media.currentTime = (e.offsetX / progressContainer.clientWidth) * media.duration;
        });
        
        function formatTime(s) { if (isNaN(s) || !isFinite(s)) return '0:00'; return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }
    </script>
</body>
</html>
